# CONFIGURACIÓN GENERAL
spring.application.name=inventario
server.port=5000

# CONFIGURACIÓN DE BASE DE DATOS (MYSQL / LARAGON)
spring.datasource.url=jdbc:mysql://localhost:3306/nombre_de_tu_bd?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURACIÓN DE JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect